name: Build complete REA ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-rea-zip.yml

permissions:
  contents: read

jobs:
  package:
    name: Package REA and its submodules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout downloader repository
        uses: actions/checkout@v4

      - name: Clone REA with its pinned submodules
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/morluto/rea.git rea
          git -C rea submodule status --recursive

      - name: Remove Git metadata and prepare artifact
        run: |
          find rea -name .git -prune -exec rm -rf {} +
          mkdir -p artifact
          mv rea artifact/rea
          du -sh artifact/rea
          find artifact/rea -maxdepth 2 -type d | sort | head -80

      - name: Upload complete source as a ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: rea-completo
          path: artifact/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
